[package]
name = "rune-music"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lofty = "0.25.5"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "d76c8a9f6cbc6e59ab49b1c08d6f58ff48c74c50", version = "0.0.1", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d76c8a9f6cbc6e59ab49b1c08d6f58ff48c74c50", version = "0.0.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
